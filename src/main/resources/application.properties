spring.application.name=mecanista

# =========================================================
# Datasource - MySQL
# =========================================================
spring.datasource.url=jdbc:mysql://localhost:3306/mecanistadb?useSSL=false&serverTimezone=America/Sao_Paulo&allowPublicKeyRetrieval=true
spring.datasource.username=mecanistaadmin
spring.datasource.password=123456
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# =========================================================
# JPA / Hibernate
# =========================================================
# validate: nao deixa o Hibernate alterar o schema, quem controla e a migration.
# Use "update" apenas em ambiente de desenvolvimento local, se preferir.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# =========================================================
# Connection Pool (HikariCP)
# =========================================================
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=30000

# =========================================================
# Servidor
# =========================================================
server.port=8080

# =========================================================
# Logging
# =========================================================
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE

